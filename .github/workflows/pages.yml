# Optional: rebuild portfolio site assets on push.
# Live hosting uses GitHub Pages "Deploy from a branch" → main → /docs
# (more reliable than the Actions deploy-pages environment on first setup).

name: Rebuild portfolio site

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "scripts/build_portfolio_site.py"
      - "reports/**"
      - "data/raw/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Rebuild docs data & assets
        run: python scripts/build_portfolio_site.py

      - name: Verify site files exist
        run: |
          test -f docs/index.html
          test -f docs/data/site_data.json
          test -d docs/assets
          echo "Portfolio site ready for Pages (branch main, folder /docs)."
